name: Release

# Builds installers for Windows (.msi/.exe), macOS (.dmg) and Linux (.AppImage/.deb) on a version tag.
# Binaries are unsigned until code-signing certificates are available; SHA-256 sums are published instead.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: core-jars
          path: client-core/versions/*/build/libs/cobalmoon-core-*.jar

  installers:
    needs: core
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: core-jars
          path: client-core/versions
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: launcher
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Public Azure client id, compiled in as the default (see docs/azure-app.md).
          COBALMOON_MSA_CLIENT_ID: ${{ vars.COBALMOON_MSA_CLIENT_ID }}
        with:
          projectPath: launcher
          tagName: ${{ github.ref_name }}
          releaseName: Cobalmoon Client ${{ github.ref_name }}
          releaseDraft: true

  checksums:
    needs: installers
    runs-on: ubuntu-latest
    steps:
      - name: Publish SHA-256 sums of every installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*'
          sha256sum -- * | tee SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
