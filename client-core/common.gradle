// Shared configuration for every client-core/versions/<mc> project.
// The version project applies the right Loom plugin first, sets `ext.javaVersion`, then applies this file.

def coreDir = rootProject.file('client-core')

repositories { mavenCentral() }

base { archivesName = "cobalmoon-core-mc${project.minecraft_version}" }

sourceSets {
    main {
        java.srcDirs = [new File(coreDir, 'src/main/java'), 'src/main/java']
        resources.srcDirs = [new File(coreDir, 'src/main/resources'), 'src/main/resources']
    }
    test {
        java.srcDirs = [new File(coreDir, 'src/test/java')]
    }
}

// Client game tests: start the real game, create a world, drive the modules and the HUD editor,
// and save screenshots. Run with `gradlew :client-core:mc-<version>:runClientGameTest`.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'cobalmoon-gametest'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

sourceSets {
    gametest {
        java.srcDirs = [new File(coreDir, 'src/gametest/java')]
        resources.srcDirs = [new File(coreDir, 'src/gametest/resources')]
    }
}

// ---- Compatibility test -------------------------------------------------------------------
// `gradlew :client-core:mc-<v>:runClientGameTest -Pcompat` runs the same game test with the
// third-party mods pinned in tests/compat/mods-<v>.json (downloaded and SHA-512 verified).
def compatList = rootProject.file("tests/compat/mods-${project.minecraft_version}.json")
def compatDir = layout.buildDirectory.dir('compat-mods').get().asFile
// Read through `providers` so the configuration cache is invalidated when the pinned list changes.
def compatJson = providers.fileContents(rootProject.layout.projectDirectory.file("tests/compat/mods-${project.minecraft_version}.json")).asText
def compatMods = compatJson.isPresent() ? new groovy.json.JsonSlurper().parseText(compatJson.get()).mods : []

tasks.register('downloadCompatMods') {
    description = 'Downloads and verifies the third-party mods used by the compatibility test.'
    def mods = compatMods.collect { [file: it.file as String, url: it.url as String, sha512: it.sha512 as String] }
    def dir = compatDir
    inputs.file(compatList)
    outputs.dir(dir)
    doLast {
        dir.mkdirs()
        def sha512 = { File f ->
            def md = java.security.MessageDigest.getInstance('SHA-512')
            f.withInputStream { s -> byte[] buf = new byte[65536]; int n; while ((n = s.read(buf)) > 0) md.update(buf, 0, n) }
            md.digest().encodeHex().toString()
        }
        mods.each { m ->
            def target = new File(dir, m.file)
            if (target.exists() && sha512(target) == m.sha512) return
            def conn = new URL(m.url).openConnection()
            conn.setRequestProperty('User-Agent', 'cobalmoon-compat-test/1.0 (open-source Minecraft PvP client)')
            conn.inputStream.withStream { input -> target.withOutputStream { it << input } }
            def actual = sha512(target)
            if (actual != m.sha512) {
                target.delete()
                throw new GradleException("SHA-512 mismatch for ${m.file}: expected ${m.sha512}, got ${actual}")
            }
            logger.lifecycle("compat: ${m.file} verified")
        }
    }
}

// `-PallModules`: start the game test with every module already enabled (as if saved), to catch modules
// that use game state before Minecraft has finished starting.
if (project.hasProperty('allModules')) {
    loom.runs.named('clientGameTest') { property('cobalmoon.test.enableAllModules', 'true') }
}

if (project.hasProperty('compat')) {
    def paths = compatMods.collect { new File(compatDir, it.file as String).absolutePath }
    loom.runs.named('clientGameTest') {
        property('fabric.addMods', paths.join(File.pathSeparator))
        property('cobalmoon.compat', 'true')
    }
    tasks.named('runClientGameTest') { dependsOn 'downloadCompatMods' }
}

loom {
    mods {
        cobalmoon { sourceSet sourceSets.main }
    }
    runs {
        client {
            // Keep each version's dev game directory separate.
            runDir = "../../../run/${project.minecraft_version}"
        }
    }
}

// Fabric API modules the core needs, bundled jar-in-jar so a clean instance works without
// installing Fabric API. If the player also has Fabric API, Fabric Loader keeps the newest copy.
def bundledFabricModules = ['fabric-api-base', 'fabric-screen-api-v1', 'fabric-resource-loader-v1',
                            'fabric-rendering-v1', 'fabric-lifecycle-events-v1', project.fabric_key_module]

dependencies {
    bundledFabricModules.each { include fabricApi.module(it, project.fabric_api_version) }

    // Lua for community scripts (pure Java, MIT). Bundled; only a sandboxed subset is exposed.
    implementation 'org.luaj:luaj-jse:3.0.1'
    include 'org.luaj:luaj-jse:3.0.1'

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test { useJUnitPlatform() }

processResources {
    def props = [
        version          : project.version,
        minecraft_dep    : project.minecraft_dep,
        java_version     : project.ext.javaVersion.toString(),
        loader_version   : project.min_loader_version,
        key_module       : project.fabric_key_module,
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}

tasks.withType(JavaCompile).configureEach {
    options.release = project.ext.javaVersion
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(project.ext.javaVersion) }
    withSourcesJar()
}

jar {
    from(rootProject.file('LICENSE')) { rename { 'LICENSE_cobalmoon' } }
}
